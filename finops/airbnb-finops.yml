description: FOCUS-aligned shape for Airbnb. Take-rate marketplace — Airbnb is paid as a percentage of
  the booking subtotal. FinOps for hosts and partners centers on host service fees (3% split or
  ~14-16% host-only), guest fees, and product-line take rates (Services 15%, Experiences 20%).
sources:
  - https://www.airbnb.com/help/article/1857
  - https://partners.airbnb.com/
billingModel:
  pricingCategory: Take Rate (Marketplace)
  billingFrequency: Per-Booking / Continuous Settlement
  billingCurrency: USD (settlement varies)
  chargeCategories:
    - Usage
    - Adjustment
    - Refund
    - Tax
focusColumns:
  ServiceName: Airbnb Marketplace
  ServiceCategory: Hospitality Marketplace
  ProviderName: Airbnb
  PublisherName: Airbnb, Inc.
  InvoiceIssuerName: Airbnb, Inc.
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: host_service_fee
    description: Host-side take rate on Homes bookings (split or host-only structure)
    unit: USD
    aggregation: sum
    dimensions:
      - fee_structure
      - country
      - listing
  - name: guest_service_fee
    description: Guest-side take rate on Homes bookings (split structure only)
    unit: USD
    aggregation: sum
    dimensions:
      - currency
      - country
  - name: services_fee
    description: 15% take rate on Airbnb Services bookings ($6 USD minimum)
    unit: USD
    aggregation: sum
    dimensions:
      - service_type
      - country
  - name: experiences_fee
    description: 20% take rate on Airbnb Experiences bookings
    unit: USD
    aggregation: sum
    dimensions:
      - experience_type
      - country
  - name: bookings_count
    description: Booking volume across the marketplace
    unit: booking
    aggregation: count
    dimensions:
      - product_line
      - country
      - listing
principles:
  - name: Visibility
    description: Hosts track payouts and fees in the Airbnb host dashboard transaction history;
      Software Partners reconcile via Reservations API and webhook events.
  - name: Allocation
    description: Allocate fees by listing, market (country / city), and product line (Homes / Services
      / Experiences). For multi-property hosts, listing ID is the canonical allocation key.
  - name: Optimization
    description: Optimize take-rate exposure by tuning pricing strategy, choosing between split and
      host-only fee structures where eligible, minimizing cancellations and refunds, and using Smart
      Pricing or pricing tools to maintain occupancy.
  - name: Accountability
    description: Hosts and property managers own marketplace fees against revenue; Software Partners
      pass-through to their hosts. Review monthly against booking subtotals and adjust pricing
      strategy quarterly.
maintainers:
