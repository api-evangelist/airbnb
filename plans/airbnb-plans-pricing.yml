specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Airbnb
providerId: airbnb
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Hospitality
  - Travel
  - Short-Term Rental
  - Marketplace
  - Take Rate
description: Airbnb does not sell API access on a per-call rate card; APIs are exposed to approved
  Software Partners (channel managers, property-management systems) and partners earn revenue inside
  the marketplace's host/guest service-fee model. Airbnb monetizes the booking transaction itself —
  most hosts pay a 3% Host-only split fee or a single Host-only fee around 14-16% (15.5% typical),
  with guests paying 14.1%-16.5%. Experiences and Services have separate take rates.
notes: API access is partner-program-gated; commercial terms are bilateral. Plans below capture the
  marketplace take-rate Airbnb actually charges, since that is the cost surface partners and hosts care
  about. Software Partner program does not expose published per-call API pricing.
sources:
  - https://www.airbnb.com/help/article/1857
  - https://partners.airbnb.com/
plans:
  - id: airbnb-software-partner
    name: Software Partner Program
    type: enterprise
    description: API access for approved channel managers and property-management software. Onboarding
      requires Airbnb Software Partner approval; commercial terms are bilateral and not publicly listed.
    entries:
      - label: Software Partner agreement
        name: software_partner_contract
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact Airbnb partner team
        userMultiplied: false
    elements:
      - name: Listings, Calendar, Pricing, Reservations, Messaging APIs
      - name: Webhooks for reservation / availability events
      - name: Approved Software Partner badge
  - id: airbnb-host-fee-split
    name: Host Fee — Split (Homes)
    type: usage-based
    description: Default Homes service-fee structure — a smaller percentage on the host plus a guest
      service fee on top. Brazil and Mexico use higher host rates.
    entries:
      - label: Host service fee — most hosts
        name: host_fee_split_global
        type: metered
        metric: booking_subtotal
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '3%'
        userMultiplied: false
      - label: Host service fee — Brazil
        name: host_fee_split_br
        type: metered
        metric: booking_subtotal
        limit: -1
        timeFrame: usage
        geo: BR
        unit: 1
        price: '4%'
        userMultiplied: false
      - label: Host service fee — Mexico (effective June 2026)
        name: host_fee_split_mx
        type: metered
        metric: booking_subtotal
        limit: -1
        timeFrame: usage
        geo: MX
        unit: 1
        price: '4%'
        userMultiplied: false
      - label: Guest service fee
        name: guest_fee
        type: metered
        metric: booking_subtotal
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: 14.1% – 16.5% (varies by booking and currency)
        userMultiplied: false
    elements:
      - name: Default for most Homes hosts
      - name: Guest pays separate service fee
  - id: airbnb-host-fee-host-only
    name: Host Fee — Host-Only (Homes)
    type: usage-based
    description: Single Host-only fee structure — Airbnb deducts one larger percentage from the host
      and the guest pays no service fee on top. Being phased in for certain hosts.
    entries:
      - label: Host-only fee — most hosts
        name: host_only_fee_global
        type: metered
        metric: booking_subtotal
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '15.5%'
        userMultiplied: false
      - label: Host-only fee — typical range
        name: host_only_fee_range
        type: metered
        metric: booking_subtotal
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: 14% – 16% (varies)
        userMultiplied: false
      - label: Host-only fee — Brazil
        name: host_only_fee_br
        type: metered
        metric: booking_subtotal
        limit: -1
        timeFrame: usage
        geo: BR
        unit: 1
        price: '16%'
        userMultiplied: false
      - label: Host-only fee — Mexico (effective June 2026)
        name: host_only_fee_mx
        type: metered
        metric: booking_subtotal
        limit: -1
        timeFrame: usage
        geo: MX
        unit: 1
        price: '16%'
        userMultiplied: false
    elements:
      - name: No guest service fee
      - name: Single take-rate on host
  - id: airbnb-services-fee
    name: Services Fee
    type: usage-based
    description: Service fee on Airbnb Services bookings.
    entries:
      - label: Services service fee
        name: services_fee
        type: metered
        metric: booking_subtotal
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: 15% (minimum $6 USD)
        userMultiplied: false
    elements:
      - name: Applies to Airbnb Services bookings
  - id: airbnb-experiences-fee
    name: Experiences Fee
    type: usage-based
    description: Service fee on Airbnb Experiences bookings.
    entries:
      - label: Experiences service fee
        name: experiences_fee
        type: metered
        metric: booking_subtotal
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '20%'
        userMultiplied: false
    elements:
      - name: Applies to Airbnb Experiences bookings
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
