method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Hospitality
  - Travel
  - Short-Term Rental
  - Marketplace
  - Rate Limiting
description: Airbnb does not publish public per-call rate-limit documentation. APIs are reserved for
  approved Software Partners and limits are governed by the Software Partner agreement, with
  partner-portal documentation provided after onboarding. Throttling responses follow standard 429 /
  Retry-After conventions.
notes: No public rate-limit documentation; values pending direct vendor confirmation through the
  Software Partner program.
sources:
  - https://partners.airbnb.com/
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Software Partner default
    scope: partner_account
    metric: varies
    limit: defined per Software Partner agreement
policies:
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter on 429 responses, honoring
      Retry-After when present.
  - name: Partner Program Scoping
    description: Limits are scoped per Software Partner account, not per individual host or listing.
      Throughput must support the partner's combined listing inventory.
  - name: Webhook Reliability
    description: Subscribe to webhooks for reservation and availability events rather than polling to
      stay within partner-tier limits.
  - name: Contractual Limits
    description: Higher throughput is negotiated as part of the Software Partner agreement; raise via
      the assigned Airbnb partner contact.
