aid: airbnb
url: 
  https://raw.githubusercontent.com/api-evangelist/airbnb/refs/heads/main/apis.yml
apis:
  - aid: airbnb:homes-api
    name: Airbnb Homes API
    tags:
      - Travel
      - Lodging
      - Vacation Rentals
      - Listings
      - Reservations
      - Property Management
    image: 
      https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.airbnb.com
    humanURL: https://developer.withairbnb.com/
    properties:
      - url: https://developer.withairbnb.com/
        type: Documentation
      - type: OpenAPI
        url: openapi/airbnb-homes-api-openapi.yml
    description: >-
      The Airbnb Homes API provides partner developers with programmatic access to
      manage vacation rental listings on the Airbnb platform. It supports creating
      and updating property listings, managing descriptions, amenities, photos, pricing,
      and availability rules. The API also enables reservation management, calendar
      synchronization, guest messaging, and review handling.
  - aid: airbnb:activities-api
    name: Airbnb Activities API
    tags:
      - Travel
      - Experiences
      - Activities
      - Tourism
      - Bookings
    image: 
      https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.airbnb.com
    humanURL: https://developer.withairbnb.com/
    properties:
      - url: https://developer.withairbnb.com/
        type: Documentation
      - type: OpenAPI
        url: openapi/airbnb-activities-api-openapi.yml
    description: >-
      The Airbnb Activities API allows approved partners to integrate with Airbnb
      Experiences, the platform's marketplace for hosted activities and tours. It
      provides endpoints for managing experience listings, handling bookings, and
      synchronizing availability for activities offered by local hosts.
  - aid: airbnb:webhooks-api
    name: Airbnb Webhooks API
    tags:
      - Webhooks
      - Events
      - Notifications
      - Real-Time
      - Reservations
    image: 
      https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.airbnb.com
    humanURL: https://developer.withairbnb.com/
    properties:
      - url: https://developer.withairbnb.com/
        type: Documentation
      - type: AsyncAPI
        url: asyncapi/airbnb-webhooks-asyncapi.yml
    description: >-
      The Airbnb Webhooks API enables connectivity partners to receive real-time notifications
      when events occur on the Airbnb platform. It supports webhook subscriptions
      for reservation changes, message creation, review submissions, listing calendar
      updates, and other key events.
common:
  - type: Website
    url: https://www.airbnb.com/
  - type: Portal
    url: https://developer.withairbnb.com/
  - type: JSON-LD
    url: json-ld/airbnb-context.jsonld
  - type: JSONSchema
    url: json-schema/airbnb-listing-schema.json
  - type: JSONSchema
    url: json-schema/airbnb-reservation-schema.json
  - type: JSONSchema
    url: json-schema/airbnb-webhook-event-schema.json
modified: '2026-04-01'
description: >-
  Airbnb's developer documentation offers everything you need to know to seamlessly
  integrate your applications with our Homes and Activities APIs, empowering you to
  manage listings, bookings, reviews and messages, and enhance user experiences for
  Hosts.
