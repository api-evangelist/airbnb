description: Airbnb is the world's leading home-sharing and short-term rental marketplace,
  connecting hosts who offer accommodations and experiences with guests worldwide.
  The Airbnb developer platform provides connectivity partners — property management
  systems, channel managers, and experience operators — with APIs to manage listings,
  reservations, calendars, messaging, reviews, and webhook-based event notifications.
  Access is restricted to approved partners.
