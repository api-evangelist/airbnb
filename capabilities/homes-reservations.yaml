    port: 9090
    transport: http
    description: MCP adapter for Airbnb Homes API — Reservations. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-reservations
      description: List Reservations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
