naftiko: 1.0.0-alpha2
info:
  label: Airbnb Homes API — Messages
  description: 'Airbnb Homes API — Messages. 2 operations. Lead operation: List Reservation Messages. Self-contained Naftiko
    capability covering one Airbnb business surface.'
  tags:
  - Airbnb
  - Messages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AIRBNB_API_KEY: AIRBNB_API_KEY
capability:
  consumes:
  - type: http
    namespace: homes-messages
    baseUri: https://api.airbnb.com/v2
    description: Airbnb Homes API — Messages business capability. Self-contained, no shared references.
    resources:
    - name: reservations-reservation_id-messages
      path: /reservations/{reservation_id}/messages
      operations:
      - name: listreservationmessages
        method: GET
        description: List Reservation Messages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: sendreservationmessage
        method: POST
        description: Send a Reservation Message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.AIRBNB_API_KEY}}'
  exposes:
  - type: rest
    namespace: homes-messages-rest
    port: 8080
    description: REST adapter for Airbnb Homes API — Messages. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/reservations/{reservation-id}/messages
      name: reservations-reservation-id-messages
      description: REST surface for reservations-reservation_id-messages.
      operations:
      - method: GET
        name: listreservationmessages
        description: List Reservation Messages
        call: homes-messages.listreservationmessages
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: sendreservationmessage
        description: Send a Reservation Message
        call: homes-messages.sendreservationmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: homes-messages-mcp
    port: 9090
    transport: http
    description: MCP adapter for Airbnb Homes API — Messages. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-reservation-messages
      description: List Reservation Messages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: homes-messages.listreservationmessages
      outputParameters:
      - type: object
        mapping: $.
    - name: send-reservation-message
      description: Send a Reservation Message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: homes-messages.sendreservationmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
