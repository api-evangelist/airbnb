name: Airbnb Listing and Reservation Management
description: Workflow capability for managing Airbnb listings, reservations, and experiences
version: 1.0.0
type: workflow
mcp_tools:
- name: manage_listing
  description: Create, update, or retrieve an Airbnb property listing
  inputs:
    action: string
    listing_id: string
    listing_data: object
  outputs:
    listing: object
    success: boolean
  rest_adapter:
    ref: airbnb-api
    operations:
    - createListing
    - updateListing
    - getListing
- name: manage_calendar
  description: Get or update listing availability and pricing on the calendar
  inputs:
    listing_id: string
    start_date: string
    end_date: string
    updates: array
  outputs:
    calendar_days: array
    success: boolean
  rest_adapter:
    ref: airbnb-api
    operations:
    - getCalendar
    - updateCalendar
- name: get_reservations
  description: Retrieve a list of reservations, optionally filtered by status or date
  inputs:
    listing_id: string
    status: string
    start_date: string
    end_date: string
  outputs:
    reservations: array
    total: integer
  rest_adapter:
    ref: airbnb-api
    operations:
    - listReservations
- name: send_message
  description: Send a message to a guest within a reservation thread
  inputs:
    reservation_id: string
    message: string
  outputs:
    message_id: string
    success: boolean
  rest_adapter:
    ref: airbnb-api
    operations:
    - createMessage
- name: manage_experience
  description: Create or update an Airbnb Experience listing
  inputs:
    action: string
    experience_id: string
    experience_data: object
  outputs:
    experience: object
    success: boolean
  rest_adapter:
    ref: airbnb-api
    operations:
    - createExperience
    - updateExperience
    - getExperience
