        idempotent: true
      call: homes-listings.getlisting
      outputParameters:
      - type: object
        mapping: $.
    - name: update-listing
      description: Update a Listing
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: homes-listings.updatelisting
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-listing
      description: Delete a Listing
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: homes-listings.deletelisting
      outputParameters:
