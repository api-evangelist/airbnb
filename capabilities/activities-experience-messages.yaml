naftiko: 1.0.0-alpha2
info:
  label: Airbnb Activities API — Experience Messages
  description: 'Airbnb Activities API — Experience Messages. 2 operations. Lead operation: List Booking Messages. Self-contained
    Naftiko capability covering one Airbnb business surface.'
  tags:
  - Airbnb
  - Experience Messages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AIRBNB_API_KEY: AIRBNB_API_KEY
capability:
  consumes:
  - type: http
    namespace: activities-experience-messages
    baseUri: https://api.airbnb.com/v2
    description: Airbnb Activities API — Experience Messages business capability. Self-contained, no shared references.
    resources:
    - name: bookings-booking_id-messages
      path: /bookings/{booking_id}/messages
      operations:
      - name: listbookingmessages
        method: GET
        description: List Booking Messages
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: sendbookingmessage
        method: POST
        description: Send a Booking Message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.AIRBNB_API_KEY}}'
  exposes:
  - type: rest
    namespace: activities-experience-messages-rest
    port: 8080
    description: REST adapter for Airbnb Activities API — Experience Messages. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/bookings/{booking-id}/messages
      name: bookings-booking-id-messages
      description: REST surface for bookings-booking_id-messages.
      operations:
      - method: GET
        name: listbookingmessages
        description: List Booking Messages
        call: activities-experience-messages.listbookingmessages
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: sendbookingmessage
        description: Send a Booking Message
        call: activities-experience-messages.sendbookingmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: activities-experience-messages-mcp
    port: 9090
    transport: http
    description: MCP adapter for Airbnb Activities API — Experience Messages. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-booking-messages
      description: List Booking Messages
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: activities-experience-messages.listbookingmessages
      outputParameters:
      - type: object
        mapping: $.
    - name: send-booking-message
      description: Send a Booking Message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: activities-experience-messages.sendbookingmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
